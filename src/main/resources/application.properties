#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:mappers/*xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=com.zhougang.timeddatacollection.mybatis.entity
# 应用服务 WEB 访问端口
server.port=8080

# ====== MySQL 数据源配置（当前使用）======
spring.datasource.url=jdbc:mysql://localhost:3306/zgdata?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=test
spring.datasource.password=123456

# MySQL兼容JPA/Hibernate，无需排除自动配置
spring.jpa.hibernate.ddl-auto=none

# ====== SQLite 数据源配置（切换回去时取消注释，并注释MySQL）======
# spring.datasource.url=jdbc:sqlite:data/timedata.db
# spring.datasource.driver-class-name=org.sqlite.JDBC
# spring.datasource.hikari.auto-commit=true
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration

# ====== 数据库方言配置 ======
# MySQL用反引号`
timedata.db.quote-char=`

# ====== 定时数据采集配置 ======
# 目标API地址（请修改为实际的URL）
timedata.api.url=http://energy.zkgtzngc.com/ahapi/energy/achievement-out/getValue/saveTime
# timeDivision固定值（可按需修改）
timedata.time-division=time_division,0,D

# ====== 定时任务回采范围与限速 ======
# 每次定时任务回采的天数：昨天起往前共N天（含昨天）
timedata.collect.days=365
# 每次定时任务回采的月数：昨月起往前共N个月（含昨月）
timedata.collect.months=12
# 相邻两次采集之间的延迟（毫秒），避免触发上游接口限速
timedata.collect.delay-ms=200

